---
# dunitru.ro — deploy pe ClausWeb (cPanel Git Version Control)
#
# Mediu:
#   user=marcelpa  home=/home/marcelpa   (dunitru.ro e Addon Domain în acest cont)
#   repo clonat în: /home/marcelpa/repositories/dunitru-ro  (= PWD la deploy)
#   document root dunitru.ro: /home/marcelpa/dunitru.ro/public_html
#
# Golirea păstrează .well-known, cgi-bin, .user.ini și php.ini — sunt fișierele
# cPanel-ului. Mai ales .well-known: acolo pune AutoSSL dovada de validare a
# domeniului, iar fără el nu se poate emite/reînnoi certificatul SSL.
#
# Site 100% static — nu există PHP, composer, bază de date. Deploy-ul înseamnă
# strict: golește document root-ul și copiază acolo conținutul lui public/.
#
# IMPORTANT: cPanel oprește deploy-ul la prima comandă cu exit != 0.
#
# ⚠ DACĂ SCHIMBI DOCUMENT ROOT-UL în cPanel, schimbă-l și mai jos, în TOATE
#   liniile. Pasul [1/4] e o plasă de siguranță: refuză să șteargă un director
#   care conține index.php (adică document root-ul aplicației Laravel Marcel).
deployment:
  tasks:
    - 'echo "=== DEPLOY dunitru.ro $(date) ===" > /home/marcelpa/deploy-dunitru.log'

    - 'echo "[1/4] verificare siguranță document root" >> /home/marcelpa/deploy-dunitru.log'
    - 'mkdir -p /home/marcelpa/dunitru.ro/public_html >> /home/marcelpa/deploy-dunitru.log 2>&1'
    - 'if [ -f /home/marcelpa/dunitru.ro/public_html/index.php ]; then echo "STOP: document root-ul conține index.php — pare a fi aplicația Laravel, nu dunitru.ro. Nu șterg nimic." >> /home/marcelpa/deploy-dunitru.log; exit 1; fi'

    - 'echo "[2/4] golire document root (ca ștergerile din repo să se propage; păstrez fișierele proprii ale cPanel)" >> /home/marcelpa/deploy-dunitru.log'
    - 'find /home/marcelpa/dunitru.ro/public_html -mindepth 1 -maxdepth 1 ! -name .well-known ! -name cgi-bin ! -name .user.ini ! -name php.ini -exec rm -rf {} + >> /home/marcelpa/deploy-dunitru.log 2>&1'

    - 'echo "[3/4] copiere public/ -> document root (inclusiv .htaccess)" >> /home/marcelpa/deploy-dunitru.log'
    - 'cp -a public/. /home/marcelpa/dunitru.ro/public_html/ >> /home/marcelpa/deploy-dunitru.log 2>&1'

    - 'echo "[4/4] conținutul publicat:" >> /home/marcelpa/deploy-dunitru.log'
    - 'ls -la /home/marcelpa/dunitru.ro/public_html >> /home/marcelpa/deploy-dunitru.log 2>&1'

    - 'echo "=== DEPLOY DONE $(date) ===" >> /home/marcelpa/deploy-dunitru.log'
